<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Calendar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --accent: #fd79a8;
            --accent-light: #ffb8d9;
            --text: #2d3436;
            --text-light: #636e72;
            --light: #f5f6fa;
            --lighter: #ffffff;
            --dark: #222f3e;
            --darker: #1a252f;
            --success: #00b894;
            --success-light: #55efc4;
            --warning: #fdcb6e;
            --warning-light: #ffeaa7;
            --danger: #d63031;
            --danger-light: #ff7675;
            --border-radius: 12px;
            --border-radius-sm: 8px;
            --box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            --box-shadow-lg: 0 15px 30px rgba(0,0,0,0.2);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --transition-fast: all 0.15s ease-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--text);
            transition: var(--transition);
        }

        .dark-mode {
            --text: #f5f6fa;
            --text-light: #b2bec3;
            --light: #222f3e;
            --lighter: #2d3436;
            --dark: #f5f6fa;
            --darker: #dfe6e9;
            background-color: var(--light);
        }

        .app-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            border-radius: var(--border-radius);
            background-color: var(--lighter);
            box-shadow: var(--box-shadow);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(to bottom, var(--primary), var(--accent));
        }

        .header-left h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            position: relative;
            padding-left: 1rem;
        }

        .header-left h1::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 70%;
            background: linear-gradient(to bottom, var(--primary), var(--accent));
            border-radius: 2px;
        }

        .header-right {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%, -50%);
            transform-origin: 50% 50%;
        }

        .btn:focus:not(:active)::after {
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(20, 20);
                opacity: 0;
            }
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #5649c0;
            transform: translateY(-2px);
            box-shadow: var(--box-shadow);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background-color: var(--primary);
            color: white;
        }

        .btn-icon {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--light);
            color: var(--text);
            box-shadow: var(--box-shadow);
        }

        .btn-icon:hover {
            transform: scale(1.1);
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
        }

        .btn-float {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
            position: absolute;
            right: 10px;
            bottom: 10px;
            opacity: 0;
            transform: scale(0);
            transition: var(--transition);
            z-index: 2;
            cursor: pointer;
        }

        .btn-float:hover {
            background-color: #5649c0;
            transform: scale(1.1) !important;
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 1rem 1.5rem;
            border-radius: var(--border-radius);
            background-color: var(--lighter);
            box-shadow: var(--box-shadow);
        }

        .month-navigation {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .current-month {
            font-size: 1.3rem;
            font-weight: 600;
            min-width: 200px;
            text-align: center;
            position: relative;
        }

        .current-month::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            border-radius: 3px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .day-header {
            text-align: center;
            font-weight: 600;
            padding: 1rem;
            color: var(--primary);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            position: relative;
        }

        .day-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background-color: var(--primary-light);
            border-radius: 2px;
        }

        .calendar-day {
            min-height: 140px;
            padding: 0.75rem;
            border-radius: var(--border-radius);
            background-color: var(--lighter);
            box-shadow: var(--box-shadow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .calendar-day:hover {
            transform: translateY(-5px);
            box-shadow: var(--box-shadow-lg);
        }

        .calendar-day:hover .btn-float {
            opacity: 1;
            transform: scale(1);
        }

        .calendar-day.empty {
            background-color: rgba(108, 92, 231, 0.05);
            box-shadow: none;
        }

        .dark-mode .calendar-day.empty {
            background-color: rgba(108, 92, 231, 0.1);
        }

        .day-number {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .today .day-number {
            color: var(--primary);
            font-weight: 700;
        }

        .today .day-number span {
            width: 25px;
            height: 25px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .events-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 100px;
            overflow-y: auto;
            padding-right: 0.5rem;
            margin-top: 0.5rem;
        }

        .event {
            font-size: 0.75rem;
            padding: 0.4rem 0.6rem;
            border-radius: var(--border-radius-sm);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: var(--transition-fast);
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 500;
        }

        .event:hover {
            transform: translateX(3px);
        }

        .event-actions {
            display: none;
            gap: 0.3rem;
        }

        .event:hover .event-actions {
            display: flex;
        }

        .event-action-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.6rem;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .event-action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .event.work {
            background-color: var(--primary);
        }

        .event.personal {
            background-color: var(--accent);
        }

        .event.social {
            background-color: var(--success);
        }

        .event.other {
            background-color: var(--warning);
            color: var(--text);
        }

        .event-form {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            border-radius: var(--border-radius);
            background-color: var(--lighter);
            box-shadow: 0 5px 30px rgba(0,0,0,0.3);
            z-index: 100;
            transition: var(--transition);
            opacity: 0;
        }

        .event-form.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .form-header h3 {
            font-size: 1.3rem;
            color: var(--primary);
            position: relative;
            padding-left: 1rem;
        }

        .form-header h3::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 70%;
            background: linear-gradient(to bottom, var(--primary), var(--accent));
            border-radius: 2px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition-fast);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-btn:hover {
            background-color: rgba(108, 92, 231, 0.1);
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
            background-color: var(--light);
            color: var(--text);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .color-options {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.8rem;
        }

        .color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .color-option.selected {
            border-color: var(--text);
            transform: scale(1.1);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.3);
        }

        .color-option i {
            opacity: 0;
            transition: var(--transition-fast);
            font-size: 0.8rem;
        }

        .color-option.selected i {
            opacity: 1;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .weather-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 1rem;
            opacity: 0.7;
        }

        .event-count {
            position: absolute;
            bottom: 8px;
            right: 8px;
            font-size: 0.7rem;
            background-color: var(--primary);
            color: white;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .calendar-grid {
                gap: 0.5rem;
            }
           
            .calendar-day {
                min-height: 100px;
            }
           
            .day-header {
                padding: 0.5rem;
                font-size: 0.7rem;
            }
           
            .event {
                font-size: 0.65rem;
                padding: 0.3rem 0.5rem;
            }
           
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
           
            .header-left, .header-right {
                width: 100%;
                justify-content: center;
            }
           
            .calendar-controls {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
           
            .month-navigation {
                width: 100%;
                justify-content: center;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .calendar-day {
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
        }

        .calendar-day:nth-child(1) { animation-delay: 0.05s; }
        .calendar-day:nth-child(2) { animation-delay: 0.1s; }
        .calendar-day:nth-child(3) { animation-delay: 0.15s; }
        .calendar-day:nth-child(4) { animation-delay: 0.2s; }
        .calendar-day:nth-child(5) { animation-delay: 0.25s; }
        .calendar-day:nth-child(6) { animation-delay: 0.3s; }
        .calendar-day:nth-child(7) { animation-delay: 0.35s; }
        .calendar-day:nth-child(8) { animation-delay: 0.4s; }
        .calendar-day:nth-child(9) { animation-delay: 0.45s; }
        .calendar-day:nth-child(10) { animation-delay: 0.5s; }
        /* Continue pattern for all days */

        .event-form {
            transform-origin: center;
        }

        .btn-float {
            animation: pulse 2s infinite;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(108, 92, 231, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-left">
                <h1>Nova Calendar</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-outline" id="addEventBtn">
                    <i class="fas fa-plus"></i> Add Event
                </button>
                <button class="btn btn-icon" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="btn btn-icon">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <div class="calendar-controls">
            <div class="month-navigation">
                <button class="btn btn-icon" id="prevMonth">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="current-month" id="currentMonth">June 2023</div>
                <button class="btn btn-icon" id="nextMonth">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            <button class="btn btn-primary" id="todayBtn">
                Today
            </button>
        </div>

        <div class="calendar-grid" id="calendarGrid">
            <!-- Day headers -->
            <div class="day-header">Sun</div>
            <div class="day-header">Mon</div>
            <div class="day-header">Tue</div>
            <div class="day-header">Wed</div>
            <div class="day-header">Thu</div>
            <div class="day-header">Fri</div>
            <div class="day-header">Sat</div>

            <!-- Calendar days will be inserted here by JavaScript -->
        </div>

        <!-- Event Form -->
        <div class="event-form" id="eventForm">
            <div class="form-header">
                <h3>Add New Event</h3>
                <button class="close-btn" id="closeFormBtn">&times;</button>
            </div>
            <form id="eventFormData">
                <div class="form-group">
                    <label for="eventTitle">Event Title</label>
                    <input type="text" id="eventTitle" class="form-control" placeholder="Enter event title" required>
                </div>
                <div class="form-group">
                    <label for="eventDate">Date</label>
                    <input type="date" id="eventDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="eventTime">Time</label>
                    <input type="time" id="eventTime" class="form-control">
                </div>
                <div class="form-group">
                    <label>Event Type</label>
                    <div class="color-options">
                        <div class="color-option selected" data-type="work" style="background-color: var(--primary);">
                            <i class="fas fa-check"></i>
                        </div>
                        <div class="color-option" data-type="personal" style="background-color: var(--accent);">
                            <i class="fas fa-check"></i>
                        </div>
                        <div class="color-option" data-type="social" style="background-color: var(--success);">
                            <i class="fas fa-check"></i>
                        </div>
                        <div class="color-option" data-type="other" style="background-color: var(--warning); color: var(--text);">
                            <i class="fas fa-check"></i>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="eventDescription">Description (Optional)</label>
                    <textarea id="eventDescription" class="form-control" rows="3" placeholder="Enter event description"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="cancelEventBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Event</button>
                </div>
            </form>
        </div>

        <div class="overlay" id="overlay"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Current date
            let currentDate = new Date();
            let currentMonth = currentDate.getMonth();
            let currentYear = currentDate.getFullYear();
           
            // DOM Elements
            const calendarGrid = document.getElementById('calendarGrid');
            const currentMonthElement = document.getElementById('currentMonth');
            const prevMonthBtn = document.getElementById('prevMonth');
            const nextMonthBtn = document.getElementById('nextMonth');
            const todayBtn = document.getElementById('todayBtn');
            const addEventBtn = document.getElementById('addEventBtn');
            const eventForm = document.getElementById('eventForm');
            const closeFormBtn = document.getElementById('closeFormBtn');
            const cancelEventBtn = document.getElementById('cancelEventBtn');
            const overlay = document.getElementById('overlay');
            const eventFormData = document.getElementById('eventFormData');
            const themeToggle = document.getElementById('themeToggle');
           
            // Event data
            let events = JSON.parse(localStorage.getItem('calendarEvents')) || [];
            let selectedEventType = 'work';
            let selectedDateElement = null;
           
            // Initialize calendar
            renderCalendar(currentMonth, currentYear);
           
            // Event listeners
            prevMonthBtn.addEventListener('click', () => {
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
                renderCalendar(currentMonth, currentYear);
            });
           
            nextMonthBtn.addEventListener('click', () => {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
                renderCalendar(currentMonth, currentYear);
            });
           
            todayBtn.addEventListener('click', () => {
                currentDate = new Date();
                currentMonth = currentDate.getMonth();
                currentYear = currentDate.getFullYear();
                renderCalendar(currentMonth, currentYear);
            });
           
            addEventBtn.addEventListener('click', openEventForm);
            closeFormBtn.addEventListener('click', closeEventForm);
            cancelEventBtn.addEventListener('click', closeEventForm);
            overlay.addEventListener('click', closeEventForm);
           
            // Color option selection
            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.color-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    this.classList.add('selected');
                    selectedEventType = this.dataset.type;
                });
            });
           
            // Form submission
            eventFormData.addEventListener('submit', function(e) {
                e.preventDefault();
               
                const title = document.getElementById('eventTitle').value;
                const date = document.getElementById('eventDate').value;
                const time = document.getElementById('eventTime').value;
                const description = document.getElementById('eventDescription').value;
               
                // Create event object
                const event = {
                    id: Date.now().toString(),
                    title,
                    date,
                    time,
                    type: selectedEventType,
                    description
                };
               
                // Add to events array
                events.push(event);
               
                // Save to localStorage
                localStorage.setItem('calendarEvents', JSON.stringify(events));
               
                // Add to calendar display
                addEventToCalendar(event);
               
                closeEventForm();
                this.reset();
            });
           
            // Theme toggle
            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('dark-mode');
                const icon = this.querySelector('i');
                if (document.body.classList.contains('dark-mode')) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                } else {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
            });
           
            // Functions
            function renderCalendar(month, year) {
                // Update month/year display
                const monthNames = ["January", "February", "March", "April", "May", "June", "July",
                                  "August", "September", "October", "November", "December"];
                currentMonthElement.textContent = `${monthNames[month]} ${year}`;
               
                // Clear previous calendar days (keep headers)
                while (calendarGrid.children.length > 7) {
                    calendarGrid.removeChild(calendarGrid.lastChild);
                }
               
                // Get first day of month and total days in month
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
               
                // Get days from previous month
                const prevMonthDays = new Date(year, month, 0).getDate();
               
                // Create empty slots for days before first day of month
                for (let i = 0; i < firstDay; i++) {
                    const dayElement = document.createElement('div');
                    dayElement.classList.add('calendar-day', 'empty');
                    const prevDay = prevMonthDays - firstDay + i + 1;
                    dayElement.innerHTML = `
                        <div class="day-number">${prevDay}</div>
                    `;
                    calendarGrid.appendChild(dayElement);
                }
               
                // Create days for current month
                const today = new Date();
                for (let i = 1; i <= daysInMonth; i++) {
                    const dayElement = document.createElement('div');
                    dayElement.classList.add('calendar-day');
                   
                    // Check if this is today
                    if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                        dayElement.classList.add('today');
                    }
                   
                    // Add weather icon randomly (demo only)
                    const hasWeather = Math.random() > 0.7;
                    const weatherIcons = ['☀️', '🌧️', '⛅', '❄️'];
                    const randomWeather = weatherIcons[Math.floor(Math.random() * weatherIcons.length)];
                   
                    // Format date for data attribute
                    const formattedDate = `${year}-${month + 1 < 10 ? '0' + (month + 1) : month + 1}-${i < 10 ? '0' + i : i}`;
                   
                    dayElement.innerHTML = `
                        <div class="day-number">${i}</div>
                        ${hasWeather ? `<div class="weather-icon">${randomWeather}</div>` : ''}
                        <div class="events-container" data-date="${formattedDate}"></div>
                        <button class="btn-float" data-date="${formattedDate}">
                            <i class="fas fa-plus"></i>
                        </button>
                    `;
                   
                    // Add click event to create new event
                    dayElement.addEventListener('click', function(e) {
                        // Don't trigger if clicking on an event or the add button
                        if (!e.target.closest('.event') && !e.target.closest('.btn-float')) {
                            const dateInput = document.getElementById('eventDate');
                            dateInput.value = this.querySelector('.events-container').dataset.date;
                            selectedDateElement = this.querySelector('.events-container');
                            openEventForm();
                        }
                    });
                   
                    calendarGrid.appendChild(dayElement);
                }
               
                // Add events to calendar
                renderEvents();
               
                // Add event listeners to float buttons
                document.querySelectorAll('.btn-float').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const dateInput = document.getElementById('eventDate');
                        dateInput.value = this.dataset.date;
                        selectedDateElement = this.parentElement.querySelector('.events-container');
                        openEventForm();
                    });
                });
            }
           
            function renderEvents() {
                // Clear all events first
                document.querySelectorAll('.events-container').forEach(container => {
                    container.innerHTML = '';
                });
               
                // Filter events for current month/year
                const currentEvents = events.filter(event => {
                    const eventDate = new Date(event.date);
                    return eventDate.getMonth() === currentMonth && eventDate.getFullYear() === currentYear;
                });
               
                // Add events to their respective days
                currentEvents.forEach(event => {
                    addEventToCalendar(event);
                });
            }
           
            function addEventToCalendar(event) {
                // Find the events container for this date
                const dateElements = document.querySelectorAll(`.events-container[data-date="${event.date}"]`);
               
                if (dateElements.length > 0) {
                    const eventElement = document.createElement('div');
                    eventElement.classList.add('event', event.type);
                    eventElement.dataset.id = event.id;
                   
                    eventElement.innerHTML = `
                        <span>${event.time ? `${event.time} ` : ''}${event.title}</span>
                        <div class="event-actions">
                            <button class="event-action-btn edit-btn" title="Edit"><i class="fas fa-pencil-alt"></i></button>
                            <button class="event-action-btn delete-btn" title="Delete"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                   
                    // Add edit and delete functionality
                    const editBtn = eventElement.querySelector('.edit-btn');
                    const deleteBtn = eventElement.querySelector('.delete-btn');
                   
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        editEvent(event.id);
                    });
                   
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteEvent(event.id);
                    });
                   
                    dateElements[0].appendChild(eventElement);
                   
                    // Update event count badge
                    updateEventCountBadge(dateElements[0]);
                }
            }
           
            function updateEventCountBadge(container) {
                // Remove existing badge if any
                const existingBadge = container.parentElement.querySelector('.event-count');
                if (existingBadge) {
                    existingBadge.remove();
                }
               
                // Add new badge if there are events
                const eventCount = container.children.length;
                if (eventCount > 0) {
                    const badge = document.createElement('div');
                    badge.classList.add('event-count');
                    badge.textContent = eventCount;
                    container.parentElement.appendChild(badge);
                }
            }
           
            function editEvent(eventId) {
                const event = events.find(e => e.id === eventId);
                if (!event) return;
               
                // Fill form with event data
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDate').value = event.date;
                document.getElementById('eventTime').value = event.time;
                document.getElementById('eventDescription').value = event.description || '';
               
                // Set event type
                document.querySelectorAll('.color-option').forEach(opt => {
                    opt.classList.remove('selected');
                    if (opt.dataset.type === event.type) {
                        opt.classList.add('selected');
                        selectedEventType = event.type;
                    }
                });
               
                // Open form
                openEventForm();
               
                // Modify form submit to handle edit
                const form = document.getElementById('eventFormData');
                const originalSubmit = form.onsubmit;
               
                form.onsubmit = function(e) {
                    e.preventDefault();
                   
                    // Update event
                    event.title = document.getElementById('eventTitle').value;
                    event.date = document.getElementById('eventDate').value;
                    event.time = document.getElementById('eventTime').value;
                    event.type = selectedEventType;
                    event.description = document.getElementById('eventDescription').value;
                   
                    // Save to localStorage
                    localStorage.setItem('calendarEvents', JSON.stringify(events));
                   
                    // Re-render events
                    renderEvents();
                   
                    // Close form and reset
                    closeEventForm();
                    form.reset();
                    form.onsubmit = originalSubmit;
                };
            }
           
            function deleteEvent(eventId) {
                if (confirm('Are you sure you want to delete this event?')) {
                    events = events.filter(e => e.id !== eventId);
                    localStorage.setItem('calendarEvents', JSON.stringify(events));
                    renderEvents();
                }
            }
           
            function openEventForm() {
                eventForm.classList.add('active');
                overlay.classList.add('active');
               
                // Focus the title field
                document.getElementById('eventTitle').focus();
            }
           
            function closeEventForm() {
                eventForm.classList.remove('active');
                overlay.classList.remove('active');
            }
        });
    </script>
</body>
</html>
